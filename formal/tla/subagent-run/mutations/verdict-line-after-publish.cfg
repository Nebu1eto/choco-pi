\* verdict-line-after-publish: a stopped queued verdict-role run is published at once and its verdict line is appended to the result afterwards.
\* See README.md, "Mutations" and "Findings".
SPECIFICATION Spec
CONSTANTS
    a1 = a1
    a2 = a2
    Agents = {a1, a2}
    WT = {a1}
    Full = {a1}
    MaxGen = 3
    MaxConc = 1
    EnvCallbackMayThrow = TRUE
    VerdictRole = {a1}
    Mutation = "verdictLineAfterPublish"
INVARIANT TypeOK StopSticks PublishOnce SettledIsPublished StaleInert ReadSeesFinal ParkedHasWake PoolExact QueueProgress
CHECK_DEADLOCK FALSE
