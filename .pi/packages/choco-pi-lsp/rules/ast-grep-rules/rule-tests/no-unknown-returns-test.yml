id: no-unknown-returns
valid:
  - "function f(x: unknown): string { return String(x); }"
  - "const g = (x: unknown): number => 1;"
  - "class C { m(): void {} }"
invalid:
  - "function f(): unknown { return 1; }"
  - "const g = (): unknown => 1;"
  - "class C { m(): unknown { return 1; } }"
  - "interface I { m(): unknown; }"
  - "type H = () => unknown;"
