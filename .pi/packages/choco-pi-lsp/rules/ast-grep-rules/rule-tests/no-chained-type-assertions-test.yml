id: no-chained-type-assertions
valid:
  - 'const v = x as A'
  - 'const w = x as A as const'
  - |
    // SAFETY: checked above
    const u = x as unknown as Foo;
  - 'const u = /* SAFETY: inline */ x as unknown as Foo;'
invalid:
  - 'const v = x as A as B'
  - 'const v = foo.bar() as A as B;'
  - 'const u = x as unknown as Foo'
  - |
    // just a comment, no safety claim
    const u = x as unknown as Foo;
