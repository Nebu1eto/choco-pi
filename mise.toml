# Development toolchain for this checkout. Run `mise install` here, then
# `pnpm install --frozen-lockfile`.
#
# Tools only: no [env], [tasks], hooks, or templates, so mise needs no
# `mise trust` for this file.
#
# node is the newest Node.js release; it must not be older than node_version in
# scripts/standalone/runtime-pins.txt, the supported floor the standalone
# installer ships. pnpm moves together with package.json packageManager and
# pnpm_version there. tests/workspace-policy.test.ts checks both.
[tools]
node = "26.13.1"
pnpm = "12.21.0"
